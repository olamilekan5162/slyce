<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Emerald gradient for the top-left slice -->
    <linearGradient id="emeraldGrad" x1="22" y1="22" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Teal/Cyan gradient for the bottom-right slice -->
    <linearGradient id="tealGrad" x1="28" y1="28" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle glow (optional, inline with modern premium assets) -->
  <circle cx="50" cy="50" r="38" fill="#10B981" opacity="0.08" filter="url(#glow)"/>

  <!-- Top-left slice -->
  <path d="M 24 70 L 70 24 A 32 32 0 0 0 24 70 Z" fill="url(#emeraldGrad)" />

  <!-- Bottom-right slice -->
  <path d="M 30 76 L 76 30 A 32 32 0 0 1 30 76 Z" fill="url(#tealGrad)" />

  <!-- Slicing accent line inside the gap -->
  <line x1="21" y1="79" x2="79" y2="21" stroke="#080A10" stroke-width="3" />
</svg>
